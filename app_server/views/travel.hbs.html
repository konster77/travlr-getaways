{{> header}}
<div id="page">
	<div id="contents">
		<div class="box">
			<div class="body">
				<h1>{{title}}</h1>

				{{#if trips.length}}
				<ul id="sites">
					{{#each trips}}
					<li>
						<a href="/travel"><img src="/images/{{image}}" alt="{{name}}"></a>
						<h2><a href="/travel">{{name}}</a></h2>
						<p>{{description}}</p>
						<p><strong>From ${{price}}</strong></p>
					</li>
					{{/each}}
				</ul>
				{{else}}
				<p>No trips yet—check back soon!</p>
				{{/if}}

			</div>
		</div>
	</div>
</div>
{{> footer}}
