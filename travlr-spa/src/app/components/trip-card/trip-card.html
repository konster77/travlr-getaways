<div class="card h-100 shadow-sm">
  <img *ngIf="trip.image" [src]="'/assets/' + trip.image" class="card-img-top" [alt]="trip.name">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }} <small class="text-muted">({{ trip.code }})</small></h5>
    <p class="mb-1"><strong>Length:</strong> {{ trip.length }} days</p>
    <p class="mb-1"><strong>Start:</strong> {{ trip.start | date:'mediumDate' }}</p>
    <p class="mb-1"><strong>Per Person:</strong> ${{ trip.perPerson }}</p>
    <p class="mb-0" *ngIf="trip.description">{{ trip.description }}</p>
  </div>
  <div class="card-footer d-flex gap-2">
    <button class="btn btn-outline-primary btn-sm" (click)="edit.emit(trip.code)">Edit</button>
    <button class="btn btn-outline-danger btn-sm" (click)="remove.emit(trip.code)">Delete</button>
  </div>
</div>
