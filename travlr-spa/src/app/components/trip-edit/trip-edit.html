<h2 class="mb-3">Edit Trip: {{ code }}</h2>
<div *ngIf="loading()" class="alert alert-info">Loading...</div>

<form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
  <!-- same fields as Add, minus 'code' -->
  <!-- ... -->
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" [disabled]="saving()">Save</button>
    <a routerLink="/trips" class="btn btn-outline-secondary">Cancel</a>
  </div>
  <div *ngIf="error()" class="alert alert-danger mt-3">{{ error() }}</div>
</form>
