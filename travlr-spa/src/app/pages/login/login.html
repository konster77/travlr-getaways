<div class="auth-page">


  <main class="center">
    <section class="card">
      <h2>Admin Login</h2>

      <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          type="email"
          placeholder="Johnnyappleseed@gmail.com"
          autocomplete="username"
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />

        <!-- Avoid disabling until the user touches the fields so the button is always visible -->
        <button
          type="submit"
          [disabled]="loading"
          aria-label="Login"
        >
          {{ loading ? 'Signing in…' : 'Login' }}
        </button>

        <p *ngIf="error" class="error" role="alert">{{ error }}</p>
      </form>
    </section>
  </main>
</div>
